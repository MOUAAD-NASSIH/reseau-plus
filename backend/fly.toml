# fly.toml app configuration file generated for reseau-plus-api on 2026-02-28T06:29:04Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'reseau-plus-api'
primary_region = 'ams'

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 5000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
